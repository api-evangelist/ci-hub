name: CI HUB MCP Server
marketing_name: CI HUB Bright AI Connector
description: 'A hosted, remote MCP server that gives an AI client governed access to whichever DAM, PIM,
  CMS or cloud-storage systems the end user has connected through CI HUB. The pitch is a governance layer
  rather than a convenience layer: rather than staff pasting assets into a chat window or circulating
  stale brand material, the AI reads the DAM directly and inherits that user''s own DAM permissions, because
  each user authenticates their own DAM account through CI HUB before the AI can reach anything.'
transport:
  hosted: true
  url: https://mcp.ci-hub.com
  endpoints_probed:
  - path: /
    method: POST
    status: 401
    note: JSON-RPC entry point; returns WWW-Authenticate with a resource_metadata pointer
  - path: /mcp
    status: 401
  - path: /sse
    status: 401
    note: an SSE path exists and is auth-gated, so both streamable-HTTP and SSE appear to be served
  - path: /health
    status: 200
    body: '{"status":"ok","timestamp":"..."}'
  server_stack: Express (x-powered-by header)
authorization:
  model: OAuth 2.1 with PKCE, per the MCP authorization spec
  challenge: 'WWW-Authenticate: Bearer error="unauthorized", error_description="Authorization needed",
    resource_metadata="https://mcp.ci-hub.com/.well-known/oauth-protected-resource"'
  protected_resource_metadata: https://mcp.ci-hub.com/.well-known/oauth-protected-resource
  authorization_server: https://mcp-auth.ci-hub.com
  authorization_server_metadata: https://mcp-auth.ci-hub.com/.well-known/oauth-authorization-server
  dynamic_client_registration: true
  registration_endpoint: https://mcp-auth.ci-hub.com/register
  pkce: S256
  grant_types:
  - authorization_code
  - refresh_token
  scopes:
  - cihub
  end_user_step: Beyond the OAuth handshake with CI HUB, each user separately authenticates the DAM accounts
    they want reachable. Users can change which systems are authenticated by disconnecting and reconnecting
    to the MCP server.
  see: scopes/ci-hub-scopes.yml
