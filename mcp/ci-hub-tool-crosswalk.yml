source: mcp/ci-hub-mcp.yml + openapi/ci-hub-access-openapi.yml
note: >-
  CI HUB runs two agent-relevant surfaces over the same content core and they are NOT the same
  API. The Access SDK HTTP API is read-only in its current release — browse, search, read detail,
  read versions — while the MCP server exposes the full write surface: upload, delete, rename,
  move, create folder, plus batch variants. Every MCP write tool is therefore mcp_only, not
  because it is composite but because the equivalent REST operation has not shipped: the client
  library declares upload() and update() with their final signatures and throws
  NotImplementedError (cihub-not-implemented) until the write engine lands. That is the finding
  this crosswalk exists to record. Bindings below are by name and documented semantics; the live
  MCP inputSchema is auth-gated (tools/list returns 401), so no confidence above medium is
  claimed for any row whose parameters could not be read.
