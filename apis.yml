- aid: ci-hub:mcp
  name: CI HUB MCP Server (Bright AI Connector)
  description: >-
    A hosted, remote Model Context Protocol server that gives an AI client governed access to the DAM
    systems a user has connected through CI HUB. It exposes core system, asset and folder tools — provider
    listing, brand config, file-to-text conversion, asset search, upload by URL, download URL, rename,
    move, delete, version history, folder browse/create/ rename/move/delete, plus batch variants — to
    ChatGPT, Claude, Gemini, Microsoft Copilot and any other MCP-compatible client. Each user authenticates
    their own DAM account through CI HUB first, so the AI inherits that user's existing DAM permissions
    rather than a service account's. Authorization is OAuth 2.1: the server publishes RFC 9728 protected-resource
    metadata pointing at mcp-auth.ci-hub.com, which advertises RFC 8414 authorization-server metadata
    with dynamic client registration and PKCE S256.
  humanURL: https://ci-hub.com/ai/mcp-server
  baseURL: https://mcp.ci-hub.com
  tags:
  - MCP
  - Artificial Intelligence
  - Digital Asset Management
  - Agents
