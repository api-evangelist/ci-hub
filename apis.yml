apis:
- aid: ci-hub:integration-sdk
  name: CI HUB Integration SDK
  description: >-
    The other direction of the CI HUB platform. A DAM, MAM, PIM, CMS, stock or cloud-storage vendor writes
    an integration that translates its own proprietary API into CI HUB's handler format using defineIntegration,
    and the result appears inside every CI HUB connector — Adobe Creative Cloud, Microsoft 365, Google
    Workspace, Figma and the rest. It is a handler contract rather than an HTTP API: the vendor implements
    named handlers (login, checkToken, refreshToken, logout, search, getFolder, download, upload, createAsset,
    updateAsset, task handlers) that CI HUB invokes, and declares a capability matrix describing what
    its platform supports. Shipped as the npm package @ci-hub/integration-sdk with an integration-cli
    for scaffolding, local development against a test UI, and submission.
  humanURL: https://developer.ci-hub.com/integration
  baseURL: https://developer.ci-hub.com/integration
  tags:
  - Digital Asset Management
  - Integration
  - SDK
  - Connectors
