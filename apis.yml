aid: ci-hub
name: CI HUB
description: >-
  CI HUB (CI HUB GmbH, Berlin) builds the connector layer between digital asset
  repositories and the applications creative and marketing teams actually work in. Its
  Connector plugs Adobe Creative Cloud, Microsoft 365, Google Workspace, Figma, Sketch,
  Canva, WordPress, SharePoint, Salesforce and Asana into more than 60 DAM, MAM, PIM, CMS,
  stock and cloud-storage systems through one uniform panel, so an asset is placed, relinked
  and version-checked without leaving the design or document. For developers CI HUB publishes
  two SDKs at developer.ci-hub.com. The Access SDK is an HTTP API under /api/v1 that lets a
  partner platform embed that same connectivity: a partner backend signs an RS256 JWT, exchanges
  it for a CI HUB session, connects an end user to a DAM provider, then browses, searches and
  reads assets over one contract regardless of which DAM is behind it. The Integration SDK runs
  the other direction, letting a DAM, PIM or storage vendor translate its own API into CI HUB's
  handler format and appear in every CI HUB connector. CI HUB also operates a hosted MCP server
  (mcp.ci-hub.com, marketed as the Bright AI Connector) that exposes governed, permission-mapped
  DAM search and asset operations to ChatGPT, Claude, Gemini, Microsoft Copilot and any other
  MCP-compatible client.
