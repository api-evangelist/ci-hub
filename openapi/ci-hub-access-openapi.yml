                                    type: array
                                    items:
                                      type: string
                                    description: '@description Hierarchical path for nested options'
                              description: '@description Available filter options (only for multiselect
                                type)'
                        description: '@description Available filters for clearance checking'
                    description: '@description Configuration for checking clearance rights'
                description: '@description Rights management configuration for the provider'
              assetSearchHelpUrl:
                type: string
                description: URL for further information on asset search, e.g. in Asset Bank a link to
                  view the last search.
                format: uri
                examples:
                - https://help.example.com/asset-search
    BadRequest:
      description: '| Code | When |

        |---|---|

        | `cihub-bad-request` | A required parameter is missing or invalid. |

        | `cihub-internal-error` | The license check failed transiently. Legacy paths answer this with
        400 for wire compatibility; it is retryable despite the 4xx status. |

        | `integration-operation-failed` | The DAM rejected the operation, or the adapter does not implement
        it. `provider` names the integration. |'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalServerError:
      description: '| Code | When |

        |---|---|

        | `cihub-internal-error` | Transient CI HUB failure. Safe to retry. |'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    SearchAssetsResponse:
      description: '@description Assets found'
      content:
        application/json:
          schema:
            type: object
            properties:
              assets:
                type: array
                items:
                  $ref: '#/components/schemas/Asset'
                description: '@description List of assets matching the search criteria'
              folders:
                type: array
                items:
                  $ref: '#/components/schemas/Folder'
                description: '@description Only returned for complex objects that are displayed also as
                  folders.'
              filters:
                type: array
                items:
                  $ref: '#/components/schemas/AssetNavigationFilter'
                description: '@description Available filters.'
              more:
                type: string
                description: Pagination cursor for next page of assets. This needs to be set in the `more`
                  parameter of the next request if you want to get the next page.
                examples:
                - next_page_token
              capabilities:
                type: object
                properties:
                  canAddAsset:
                    type: boolean
                    description: Whether the user has permission to upload assets in the search context
                    examples:
                    - true
                description: '@description Used to flag if the user has permission to upload assets in
                  the search view.'
              totalAssetsCount:
                type: number
                description: Total number of assets matching the search criteria.
                examples:
                - 150
            required:
            - assets
            - folders
            - filters
            - more
            - totalAssetsCount
    Unauthorized:
      description: '| Code | When |

        |---|---|

        | `cihub-access-token-missing` | No `Authorization` header. |

        | `cihub-access-token-invalid` | CI HUB token signature failed, expired, or the user record was
        removed. |

        | `integration-auth-failed` | The DAM connection token expired, was invalid, or its refresh failed.
        Renew the DAM connection. `provider` names the integration. |'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: '| Code | When |

        |---|---|

        | `provider-access-token-missing` | No `provider-authorization` header. Complete a DAM login first.
        |

        | `provider-access-token-invalid` | The `provider-authorization` token failed verification or
        expired. Start a new DAM login. |

        | `integration-forbidden` | The DAM denied access (permissions, roles). `provider` names the integration.
        |'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: '| Code | When |

        |---|---|

        | `integration-not-found` | The asset, folder, or version does not exist in the DAM, or the DAM
        does not support this lookup. `provider` names the integration. |


        Some legacy paths answer 404 with an empty or plain-text body instead of the

        envelope. Treat any 404 as not-found regardless of body shape.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotImplemented:
      description: '| Code | When |

        |---|---|

        | `integration-not-implemented` | The adapter has not implemented this operation yet. |

        | `integration-not-supported` | The DAM has no equivalent feature. |


        `provider` names the integration in both cases.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    GetFolderResponse:
      description: '@description Folder contents retrieved successfully'
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                description: Unique identifier for the folder
                examples:
                - folder_12345
              name:
                type: string
                description: Display name of the folder
                examples:
                - Marketing Assets 2024
              more:
                type: string
                description: Pagination cursor for next page of assets. This needs to be set in the `more`
                  parameter of the next request if you want to get the next page.
                examples:
                - next_page_token
              capabilities:
                $ref: '#/components/schemas/FolderCapabilities'
              folders:
                type: array
                items:
                  $ref: '#/components/schemas/Folder'
                description: '@description Array of subfolders within this folder'
              assets:
                type: array
                items:
                  $ref: '#/components/schemas/Asset'
                description: '@description Array of assets within this folder'
              filters:
                type: array
                items:
                  $ref: '#/components/schemas/AssetNavigationFilter'
                description: '@description Available filters.'
              totalAssetsCount:
                type: number
                description: Total number of assets in this folder.
                examples:
                - 150
            required:
            - id
            - more
            - capabilities
            - folders
            - assets
            - totalAssetsCount
    GetAssetVersionsResponse:
      description: '@description Version history for the asset.'
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                description: '@description Asset identifier'
              name:
                type: string
                description: '@description Asset name'
              versions:
                type: array
                items:
                  $ref: '#/components/schemas/Asset'
                description: '@description Array of asset versions'
            required:
            - id
            - name
            - versions
  parameters:
    size:
      name: size
      in: query
      schema:
        type: string
      description: Number of assets to return per page. The maximum value is also specified by the provider
        in the server configuration. The smaller of the two values will be used.
      examples:
        example1:
          value: 50
    more:
      name: more
      in: query
      schema:
        type: string
      description: Token for continuing a previous request on the next page. Should be set to the value
        of `more` as received by the previous call to this endpoint.
      examples:
        example1:
          value: next_page_token
    filters:
      name: filters
      in: query
      schema:
        type: array
        items:
          type: string
      description: List of filters to apply to the search. An array of option ids is expected here. You
        can optain them in the response of the previous call to this endpoint inside each filter in the
        `filters` property.
      examples:
        example1:
          value:
          - file_type:jpg
          - category:marketing
    timeZone:
      name: timeZone
      in: query
      schema:
        type: string
      description: 'Only used for AdmiralCloud and Asana.

        Timezone for date/time formatting. It expects a valid timezone based on the Intl.DateTimeFormat
        library.

        Use Intl.DateTimeFormat().resolvedOptions().timeZone to get the timezone of the user.

        See https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Intl/DateTimeFormat/resolvedOptions#timezone
        for more information.'
      examples:
        example1:
          value: Africa/Tunis
    dataLocale:
      name: dataLocale
      in: query
      schema:
        type: string
      description: If the provider supports data localization, this is the locale for the content of the
        data (e.g., values of metadata fields). You can find the supported data locales of the provider
        in the response of the /system/providerInfo route. Send the id of the locale here.
      examples:
        example1:
          value: de-DE
    uiLocale:
      name: uiLocale
      in: query
      schema:
        type: string
        enum:
        - en
        - de
        - fr
        - es
        - ja
        - zh
      description: Locale for user interface elements. For example, labels of metadata fields. Only the
        locales in the enum are supported. When omitted, providers fall back to `en`.
      examples:
        example1:
          value: en
  requestBodies:
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              dataBase64:
                type: string
                description: Either Base64 encoded image data or an HTTP/HTTPS URL to the image.
                examples:
                - data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAOEAA...
            required:
            - dataBase64
