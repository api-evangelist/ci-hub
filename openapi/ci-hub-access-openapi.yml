  statement: 'CI HUB does not serve its OpenAPI document at a public URL. It does publish the document''s
    complete machine-readable projection: `@ci-hub/access-sdk` ships `dist/index.d.ts`, generated by `openapi-typescript`
    from the same OpenAPI specification that renders developer.ci-hub.com/access (''All request and response
    types are generated from the same OpenAPI specification that produces this reference''). This document
    is that projection walked back into OpenAPI 3.1. It is a derivation of a first-party artifact, not
    an authored specification.'
  sources:
  - what: paths, operationIds, summaries, descriptions, parameters, request bodies, responses, components.schemas
      / responses / parameters / requestBodies
    from: npm @ci-hub/access-sdk@0.2.0 -> package/dist/index.d.ts (openapi-typescript emission, Apache-2.0)
    url: https://registry.npmjs.org/@ci-hub/access-sdk/-/access-sdk-0.2.0.tgz
    method: derived
  - what: info.title, info.description, info.termsOfService, externalDocs, servers[]
