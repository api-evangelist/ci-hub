                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: '@description Filter identifier'
                    name:
                      type: string
                      description: '@description Filter display name'
                    i18nName:
                      type: object
                      additionalProperties:
                        type: string
                      description: Object containing the filter name for each supported locale for this
