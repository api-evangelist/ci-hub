                        de: Name
                        fr: Nom
                    options:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                          default:
                            type: boolean
                          isDisabled:
                            type: boolean
                          isActive:
                            type: boolean
                          i18nName:
                            type: object
                            additionalProperties:
                              type: string
                            description: Object containing the filter option name for each supported locale
