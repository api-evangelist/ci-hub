                            examples:
                            - en: Name
                              de: Name
                              fr: Nom
                        additionalProperties:
                          type: string
                      description: '@description Available filter options'
                    showInSimilarSearch:
                      type: boolean
                      description: '@description Whether filter appears in similar search'
                  additionalProperties: {}
                description: '@description Those are the pre-search filters that can be selected before
                  the search is triggered.'
              createAssetOptions:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: '@description Option identifier'
                    name:
                      type: string
                      description: '@description Option display name'
                    type:
                      type: string
                      description: Input type. This list is not complete.
                      examples:
                      - select
                    required:
                      type: boolean
                      description: Whether this option is required
                      examples:
                      - false
                    options:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                      description: '@description Available choices for this option'
                description: '@description Options for asset creation'
              updateAssetOptions:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: '@description Option identifier'
                    name:
                      type: string
                      description: '@description Option display name'
                    type:
                      type: string
                      description: Input type. This list is not complete.
                      examples:
                      - select
                    required:
                      type: boolean
                      description: '@description Whether this option is required'
                    options:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                      description: '@description Available choices for this option'
                description: '@description Options for asset updating'
              requestHeaders:
                type: object
                additionalProperties: {}
                description: Additional HTTP headers required for uploading or downloading assets or thumbnails.
