entries:
- version: July 2026
  date: '2026-07'
  breaking: false
  additions:
  - title: DAM login takes provider parameters
    detail: >-
      The initiate call accepts serverUrl, which answers up front the instance prompt CI HUB would
      otherwise show the end user. Six providers read it — bynder, dash, fotoware, frontify,
      picturepark, purered. Omitting it leaves the flow unchanged.
    operation: damLoginInitiate
  - title: Email in the request body is documented
    detail: >-
      Token exchange has always accepted email in the JSON body when the partner JWT carries no
      email claim, which is how partners who anonymize the address integrate. Behavior unchanged;
      it now has examples and the two constraints written down.
    operation: exchangeToken
    kind: documentation
- version: Phase 1 (June 2026)
  date: '2026-06'
  breaking: false
  highlights:
  - First release of the Access SDK — read-only access to a connected DAM.
  - 'Authentication: token exchange. A partner backend signs a JWT and exchanges it for a CI HUB
    access token and refresh token (POST /auth/exchangeToken). Server to server, no browser
    redirect.'
  - 'DAM connection: list available providers, initiate and poll a provider login, read provider
    capabilities.'
  - 'Content: browse folders, keyword and similarity search, read asset detail and version history.
    Read-only.'
  - 'Errors: one standard error envelope across every endpoint, with a source field separating CI
    HUB errors from provider errors.'
