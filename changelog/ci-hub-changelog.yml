note: >-
  A real dated changelog exists for the Access SDK, and it leads with the stability contract
  rather than the entries — which is the right order, because the contract is what tells a reader
  which entries they will and will not see. Additive changes ship WITHOUT appearing here at all;
  the changelog is where breaking changes get announced before they ship. So this is not a
  complete record of what changed, by design, and a consumer should not treat a quiet changelog as
  a quiet API. The Connector product has a separate, unstructured release stream on the marketing
  blog; it is not this changelog and is not versioned with the API.
