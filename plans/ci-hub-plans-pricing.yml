note: >-
  CI HUB publishes real per-seat list prices for its END-USER products — the connector plugins, CI
  HUB Drive and Brand Connector — in both EUR and USD, which is more transparency than most of
  this category offers. It publishes NOTHING for the developer surface. There is no price, tier or
  metering unit anywhere for the Access SDK, the Integration SDK or the MCP server; the Access SDK
  docs say only that "commercial terms are agreed during onboarding", and the API enforces that
  with a dedicated 402 cihub-sdk-no-subscription. So a developer evaluating this API cannot find
  out what it costs without talking to a partner manager. Both facts are recorded: the published
  product plans below, and the absent developer pricing.
