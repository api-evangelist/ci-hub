sla:
  published: false
  note: No SLA, uptime target or support-response commitment is published on the public site.
support:
  help_center: https://support.ci-hub.com/
  support_page: https://ci-hub.com/support
  escalation_model: >-
    The docs define a support chain rather than an SLA — end user, partner platform, CI HUB, DAM
    provider — and use error.source to route a ticket to the right link in it. cihub errors go to
    CI HUB; integration errors go to the DAM owner.
release_history:
  access_sdk:
  - date: '2026-07'
    kind: additive
    note: DAM login accepts provider parameters (serverUrl); email in the exchange request body
      documented
  - date: '2026-06'
    kind: initial
    note: Phase 1, first release of the Access SDK — read-only access to a connected DAM
  see: changelog/ci-hub-changelog.yml
  connector_product:
    note: >-
      The Connector desktop/plugin product has its own release stream announced on the marketing
      blog (versions 1.1.100, 1.2.11, 1.2.36, 1.2.64 among them). That is a separate lifecycle
      from the API and is not versioned with it.
maturity:
  access_sdk: >-
    Young and honest about it. First release June 2026, read-only, with the write engine named as
    future work in the client library rather than implied. The npm package sits at 0.2.0.
  mcp_server: >-
    Shipping. Full read and write tool surface with published tool names, OAuth 2.1 with dynamic
    client registration, and a documented concurrency ceiling — a broader capability surface than
    the REST API it sits beside.
  integration_sdk: >-
    The mature side of the platform. 60-plus integrations exist in production behind the CI HUB
    Connector; the SDK is the packaging of a contract that has been running for years.
