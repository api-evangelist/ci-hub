  answers RFC 9728 protected-resource metadata and RFC 8414 authorization-server metadata
  anonymously, and its authorization server mcp-auth.ci-hub.com answers both RFC 8414 and OIDC
  discovery. Those four documents are real and saved verbatim below; everything else is a
  recorded absence.
